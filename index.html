<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TerraGrid 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="nav">
    <div class="logo">TerraGrid 3D</div>
    <nav class="tabs">
      <button class="tab active" id="explore">Explore</button>
      <button class="tab">Compare areas</button>
      <button class="tab">Scenarios</button>
    </nav>
    <div class="nav-right">
      <button class="pill" id="demo">Demo</button>
      <span class="sep"></span>
      <a class="nav-link" href="#">Data &amp; methods</a>
      <span class="sep"></span>
      <button class="icon-btn" aria-label="Help">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg>
      </button>
    </div>
  </header>

  <main class="app">
    <section class="map-wrap">
      <div id="map"></div>

      <div class="toolbar">
        <label class="ctl search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="text" id="search" list="cities" placeholder="Find a city or area" autocomplete="off" />
          <datalist id="cities"></datalist>
        </label>
        <div class="ctl chips" id="layers">
          <button data-k="heat" class="on" style="--c:#e5484d"><svg viewBox="0 0 24 24"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0Z"/></svg>Heat</button>
          <button data-k="smoke" style="--c:#a16207"><svg viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9Z"/></svg>Smoke</button>
          <button data-k="canopy" style="--c:#15803d"><svg viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10Z"/><path d="M2 21c0-3 1.9-5.4 5.1-6"/></svg>Canopy</button>
          <button data-k="solar" style="--c:#d97706"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Solar</button>
        </div>
        <div class="ctl seg">
          <button id="btn-2d">2D</button>
          <button id="btn-3d" class="on">3D</button>
        </div>
      </div>

      <div class="legend" id="legend"></div>

    </section>

    <aside class="panel">
      <div class="crumbs"><span id="crumb">Sydney</span> / <span>Selected area</span>
        <button class="icon-btn close" id="p-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <h1 id="p-name">Parramatta</h1>

      <div class="eyebrow live" id="eyebrow">Air temperature now</div>
      <div class="big" id="temp">--.-°C</div>
      <div class="delta" id="delta">&nbsp;</div>
      <div class="lrows" id="lrows"></div>

      <div class="stats">
        <div class="stat">
          <div class="stat-h"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><path d="M6 21v-2a6 6 0 0 1 12 0v2"/><circle cx="4.5" cy="10" r="2"/><circle cx="19.5" cy="10" r="2"/><path d="M1 19v-1a3.5 3.5 0 0 1 4-3.4M23 19v-1a3.5 3.5 0 0 0-4-3.4"/></svg>Residents</div>
          <div class="stat-v" id="p-pop">64.7k</div>
        </div>
        <div class="stat">
          <div class="stat-h"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 12 0v1"/><circle cx="17" cy="8" r="3"/><path d="M16 15a5 5 0 0 1 6 5v1"/></svg>Age 65+</div>
          <div class="stat-v" id="p-age">18%</div>
        </div>
        <div class="stat">
          <div class="stat-h"><svg viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>Schools</div>
          <div class="stat-v" id="p-schools">11</div>
        </div>
        <div class="stat">
          <div class="stat-h"><svg viewBox="0 0 24 24"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/></svg>Aged care</div>
          <div class="stat-v" id="p-aged">14</div>
        </div>
      </div>

      <button class="cta">Test canopy scenario
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>

      <section class="scn">
        <div class="scn-h">
          <button class="icon-btn" id="s-back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
          <div><div class="eyebrow">Cooling scenario</div><div class="scn-where" id="s-where"></div></div>
          <button class="ghost sm" id="s-reset">Reset</button>
        </div>
        <div class="levers">
          <label><input type="checkbox" id="s-roofs" checked /> Cool roofs</label>
          <label><input type="checkbox" id="s-trees" checked /> Tree canopy</label>
          <label><input type="checkbox" id="s-solar" checked /> Rooftop solar</label>
        </div>
        <label class="cov">Coverage <b id="s-cov-v">50%</b>
          <input type="range" id="s-cov" min="0" max="100" value="50" />
        </label>
        <div class="kpis">
          <div><div class="kpi-v cool" id="k-t">−0.0°C</div><div class="kpi-l">Surface temperature</div></div>
          <div><div class="kpi-v cool" id="k-ac">−0%</div><div class="kpi-l">Peak AC demand</div></div>
          <div><div class="kpi-v" id="k-mwh">+0</div><div class="kpi-l">MWh/yr solar</div></div>
          <div><div class="kpi-v" id="k-usd">$0k</div><div class="kpi-l">Saved per year</div></div>
        </div>
        <button class="cta" id="s-export">Export council brief (PDF)</button>
      </section>
    </aside>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
